name: Duo debug build

# Builds an installable debug APK of GameNativeDuo (modern flavour, Android 10+) on every push to the
# fork's working branches and on pull requests into devkit. Download it from the run's Artifacts.
# Then checks our own code: the style of app.gamenative.duo, its unit tests, and (second job) the SDK and
# duo tool tests. The APK is uploaded first, so a failing test still leaves a build to try.

on:
  push:
    branches: [ "devkit", "duo/**" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "devkit" ]
  workflow_dispatch:

concurrency:
  group: duo-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'utkarshdalal/GameNative'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use the fork's shared debug keystore
        # Same signature on every build, so new APKs install over old ones without uninstalling.
        run: |
          mkdir -p ~/.android
          cp duo/debug.keystore ~/.android/debug.keystore

      - name: Dummy build-time credentials
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Build modern debug APK
        run: ./gradlew -Pkotlin.daemon.jvmargs=-Xmx3g :app:assembleModernDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameNativeDuo-modern-debug-${{ github.run_number }}
          path: app/build/outputs/apk/modern/debug/*.apk
          retention-days: 14

      - name: Duo style check
        # Only app.gamenative.duo: lintKotlinMain stops inside upstream files.
        run: ./gradlew -Pkotlin.daemon.jvmargs=-Xmx3g :app:lintKotlinDuo

      - name: Duo unit tests
        # Only our package: some upstream tests assert /data/data/app.gamenative paths and fail under the duo id.
        if: success() || failure()
        run: ./gradlew -Pkotlin.daemon.jvmargs=-Xmx3g :app:testModernDebugUnitTest --tests 'app.gamenative.duo.*'

      - name: Upload test and style reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: duo-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testModernDebugUnitTest/
            app/build/reports/ktlint/duo-lint.txt
          retention-days: 14

  sdk-tests:
    # The Duo SDKs (C#, Lua, C) and the duo tool with its simulator. No Android build. The Unity game-profile tests
    # (duo/mods-src/unity/GameProfileTests) are not here: they compile against a game's UnityEngine.dll, which cannot
    # be in the repository; run them locally with -p:ManagedPath=<Game_Data/Managed>.
    if: github.repository != 'utkarshdalal/GameNative'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit

      - name: C# SDK tests
        run: dotnet test duo/sdk/csharp/GameNativeDuo.Sdk.Tests

      - name: duo tool and simulator tests
        if: success() || failure()
        run: dotnet test duo/tools/duo/tests

      - name: Lua SDK test
        if: success() || failure()
        run: luajit duo/sdk/lua/tests/test_duo.lua

      - name: C SDK test
        if: success() || failure()
        run: |
          gcc -std=c99 -D_DEFAULT_SOURCE -Wall -o "$RUNNER_TEMP/test_duo" duo/sdk/c/tests/test_duo.c
          "$RUNNER_TEMP/test_duo"
