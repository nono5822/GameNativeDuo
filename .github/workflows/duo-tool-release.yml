name: Duo tool

# Builds the `duo` developer tool (duo/tools/duo) as one self-contained file per platform. On tags like duo-v1.4.0 the
# files are attached to that tag's draft release, next to the APK from duo-release.yml. On branch pushes that touch
# the tool they are only kept as artifacts of the run, which checks that every platform still builds.

on:
  push:
    tags: [ "duo-v*" ]
    branches: [ devkit, "duo/**" ]
    paths:
      - "duo/tools/duo/**"
      - "duo/sdk/**"
      - ".github/workflows/duo-tool-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository != 'utkarshdalal/GameNative'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, built: duo, file: duo-linux-x64 }
          - { os: windows-latest, rid: win-x64, built: duo.exe, file: duo-windows-x64.exe }
          - { os: macos-latest, rid: osx-arm64, built: duo, file: duo-macos-arm64 }
          - { os: macos-latest, rid: osx-x64, built: duo, file: duo-macos-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: bash
        run: |
          dotnet publish duo/tools/duo/src -c Release -r ${{ matrix.rid }} -o out
          mv "out/${{ matrix.built }}" "${{ matrix.file }}"

      - name: Run it
        # The x64 macOS file is built on an arm64 runner; it runs there through Rosetta when that is installed.
        if: matrix.rid != 'osx-x64'
        shell: bash
        run: |
          "./${{ matrix.file }}" version
          "./${{ matrix.file }}" help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
          retention-days: 30

  attach:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The APK workflow of the same tag (duo-release.yml) may have made the draft already.
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft \
            --title "GameNative Duo ${GITHUB_REF_NAME#duo-v}" \
            --notes "Draft made by the release workflow. Check the APK on a device, write the notes, then publish." || true
          (cd files && sha256sum duo-* > duo-tool-sha256.txt && cat duo-tool-sha256.txt)
          gh release upload "$GITHUB_REF_NAME" files/duo-* --clobber
