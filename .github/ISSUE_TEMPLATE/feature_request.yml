name: Feature request
description: An idea for the app, the editors or the tools for modders
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing
      description: What you were trying to do and where the app stopped you.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What it could look like
      description: Optional. How you imagine it working, on which screen.
  - type: dropdown
    id: who
    attributes:
      label: Who is it for
      options:
        - Players
        - People who make mods or layouts
        - Both
    validations:
      required: true
