name: Bug report
description: Something in GameNative Duo's dual-screen features does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is for the dual-screen features of GameNative Duo. If the same thing happens with Dual screen off, or in
        official GameNative, please report it to GameNative instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what both screens showed instead.
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: The game and the mod in use (bundled, a community mod, or region view).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: AYN Thor
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GameNative Duo version
      description: From the app's settings, or the name of the APK you installed.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Dual screen status
      description: Open the status next to the Play button ("Dual screen status") and copy what it says, if it shows a problem.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: A photo of both screens helps most. Logs if you have them (`adb logcat -s GNDuo`).
